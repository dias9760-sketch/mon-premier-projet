<!-- Zarahissi 2027 · Bandeau de réassurance -->
<!-- À coller dans Wix : Ajouter > Intégrer du code > Intégrer HTML > Code -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
  :root{--marine:#1B2A41;--or-700:#7E5F24;--encre-2:#4E596B;--ligne:#E6DECB;--blanc:#FFFFFF}
  html,body{margin:0;padding:0;background:transparent}
  .reassure{display:flex;overflow-x:auto;scrollbar-width:none;border-block:1px solid var(--ligne);background:var(--blanc);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--marine)}
  .reassure::-webkit-scrollbar{display:none}
  .reassure div{flex:none;display:flex;gap:10px;align-items:center;padding:14px 18px;font-size:13px;line-height:1.35}
  .reassure div+div{border-left:1px solid var(--ligne)}
  .reassure p{margin:0}
  .reassure b{display:block;font-size:14px}
  .reassure span{color:var(--encre-2)}
  .reassure svg{width:26px;height:26px;flex:none;fill:none;stroke:var(--or-700);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  @media (min-width:900px){.reassure{justify-content:center}.reassure div{flex:1;max-width:330px;padding:18px 24px}}
</style>
</head>
<body>
<div class="reassure" role="list">
  <div role="listitem"><svg viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg><p><b>Livraison suivie</b><span>Mayotte · Réunion · Antilles · France</span></p></div>
  <div role="listitem"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg><p><b>Bijoux personnalisés</b><span>Prénom, date, gravure express</span></p></div>
  <div role="listitem"><svg viewBox="0 0 24 24"><path d="M4 10l1.5-5h13L20 10M4 10h16v10H4zM9 20v-5h6v5"/></svg><p><b>Retrait sur place</b><span>Gratuit, à la boutique</span></p></div>
  <div role="listitem"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><p><b>Paiement sécurisé</b><span>Carte bancaire, PayPal</span></p></div>
</div>
</body>
</html>
