<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zarahissi · Bijoux personnalisés à petit prix · Mayotte, Réunion, France, DOM-TOM</title>
<meta name="description" content="Bijoux personnalisés, bijoux des îles, montres et accessoires à petit prix. Préparés à Mayotte, livrés à La Réunion, en Guadeloupe, en Martinique et en France. Retrait gratuit à Mamoudzou.">
<meta name="theme-color" content="#1B2A41">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:wght@400;500;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   Zarahissi 2027 · Design system « Lagon chic » : les tokens
   Ces variables correspondent 1:1 aux réglages de thème de Wix Studio
   (Site Styles › Couleurs / Typographie). Ne pas utiliser de couleur en dur
   ailleurs que dans ce fichier.
   ========================================================================= */
:root {
  /* --- Couleurs de marque (reprises du site actuel) --- */
  --zr-marine:        #1B2A41;  /* principale : texte, boutons, logo */
  --zr-marine-900:    #111C2E;  /* survol des boutons, pied de page */
  --zr-sable:         #E9E0B8;  /* pastilles, boutons sur fond marine */
  --zr-creme:         #F6F1E4;  /* sections alternées, cartes */
  --zr-ivoire:        #FBF8F1;  /* fond de page */
  --zr-ardoise:       #7896A6;  /* accent secondaire, kicker */
  --zr-ardoise-700:   #4F6D7D;  /* ardoise lisible sur fond clair (AA) */
  --zr-or:            #C4A15A;  /* couronne, filets, étoiles (décor uniquement) */
  --zr-or-700:        #7E5F24;  /* or lisible sur fond clair (AA) */
  --zr-terracotta:    #A0442E;  /* Bons plans, prix barrés, alertes */
  --zr-succes:        #2F6B4F;

  /* --- Neutres --- */
  --zr-blanc:         #FFFFFF;
  --zr-encre:         #1B2A41;
  --zr-encre-2:       #4E596B;  /* texte secondaire : 6,7:1 sur ivoire */
  --zr-ligne:         #E6DECB;
  --zr-ligne-2:       #D6CBAE;

  /* --- Fonds des illustrations produit --- */
  --zr-tile-1: #EEF3F4;
  --zr-tile-2: #F4EFE2;
  --zr-tile-3: #EAF0F2;
  --zr-tile-4: #F7F2E6;

  /* --- Typographies (2 familles + 1 police de gravure) --- */
  --zr-font-titre: 'Cormorant Garamond', 'Times New Roman', serif;
  --zr-font-texte: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --zr-font-gravure: 'Great Vibes', cursive;   /* aperçu de gravure uniquement */

  /* Échelle mobile (16 px minimum pour le texte courant) */
  --zr-fs-xs: 12px;
  --zr-fs-sm: 14px;
  --zr-fs-md: 16px;
  --zr-fs-lg: 18px;
  --zr-fs-h3: 24px;
  --zr-fs-h2: 30px;
  --zr-fs-h1: 34px;

  /* --- Espacements, rayons, ombres --- */
  --zr-gutter: 16px;
  --zr-radius: 4px;
  --zr-radius-arche: 999px 999px 6px 6px; /* signature « arche » */
  --zr-shadow: 0 12px 32px -18px rgba(17, 28, 46, .35);
  --zr-touch: 44px;                       /* zone tactile minimale */

  /* --- Mouvement (200–600 ms) --- */
  --zr-ease: cubic-bezier(.2, .7, .2, 1);
  --zr-t-fast: 200ms;
  --zr-t: 350ms;
  --zr-t-slow: 600ms;

  /* --- Hauteurs fixes --- */
  --zr-tabbar-h: 64px;
}

@media (min-width: 1024px) {
  :root {
    --zr-gutter: 40px;
    --zr-fs-h3: 28px;
    --zr-fs-h2: 38px;
    --zr-fs-h1: 56px;
    --zr-tabbar-h: 0px;
  }
}

@media (prefers-reduced-motion: reduce) {
  :root { --zr-t-fast: 1ms; --zr-t: 1ms; --zr-t-slow: 1ms; }
}

</style>
<style>
/* =========================================================================
   Zarahissi 2027 · Styles du prototype (mobile d'abord)
   Points de rupture : 768 px (tablette), 1024 px (ordinateur)
   ========================================================================= */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: calc(var(--hdr-h, 112px) + 12px); scroll-padding-bottom: calc(var(--zr-tabbar-h) + 90px); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--zr-ivoire); color: var(--zr-encre);
  font: 400 var(--zr-fs-md)/1.55 var(--zr-font-texte);
  padding-bottom: calc(var(--zr-tabbar-h) + env(safe-area-inset-bottom));
  overflow-x: hidden;
}
body.no-scroll { overflow: hidden; }
img, svg { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--zr-font-titre); font-weight: 600; line-height: 1.12; margin: 0; letter-spacing: .2px; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--zr-ardoise-700); outline-offset: 2px; }
main:focus { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { width: 100%; max-width: 1320px; margin: 0 auto; padding: 0 var(--zr-gutter); }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 24px; border-radius: 2px;
  background: var(--zr-marine); color: var(--zr-blanc); border: 1.5px solid var(--zr-marine);
  font-weight: 700; font-size: 15px; letter-spacing: .3px; text-decoration: none; white-space: nowrap;
  transition: background var(--zr-t-fast), transform var(--zr-t-fast), color var(--zr-t-fast);
}
.btn:hover { background: var(--zr-marine-900); }
.btn:active { transform: scale(.98); }
.btn--ghost { background: transparent; color: var(--zr-marine); }
.btn--ghost:hover { background: var(--zr-marine); color: var(--zr-blanc); }
.btn--sable { background: var(--zr-sable); color: var(--zr-marine); border-color: var(--zr-sable); }
.btn--sable:hover { background: var(--zr-blanc); }
.btn--block { width: 100%; }
.btn--wa { background: #1F7A4C; border-color: #1F7A4C; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link { font-weight: 700; font-size: 14px; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--zr-or); }
.icon-btn { width: var(--zr-touch); height: var(--zr-touch); display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; position: relative; }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--zr-ardoise-700); }

/* ---------- Badges, prix, étoiles ---------- */
.badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; padding: 4px 8px; border-radius: 2px; background: var(--zr-blanc); color: var(--zr-marine); }
.badge--perso { background: var(--zr-marine); color: var(--zr-sable); }
.badge--promo { background: var(--zr-terracotta); color: var(--zr-blanc); }
.badge--new { background: var(--zr-sable); }
.price { font-weight: 700; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.price s { color: var(--zr-encre-2); font-weight: 400; font-size: .85em; }
.price .promo { color: var(--zr-terracotta); }
.stars { color: var(--zr-or-700); font-size: 12px; letter-spacing: 1px; }
.stars span { color: var(--zr-encre-2); letter-spacing: 0; margin-left: 4px; }

/* ---------- Bandeau d'annonce ---------- */
.announce { background: var(--zr-marine); color: var(--zr-sable); font-size: 13px; white-space: nowrap; text-align: center; height: 34px; overflow: hidden; position: relative; }
.announce p { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 12px; opacity: 0; transform: translateY(100%); transition: opacity var(--zr-t-slow) var(--zr-ease), transform var(--zr-t-slow) var(--zr-ease); }
.announce p.on { opacity: 1; transform: none; }
.announce p.off { opacity: 0; transform: translateY(-100%); }

/* ---------- En-tête ---------- */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: rgba(255, 255, 255, .96); backdrop-filter: blur(8px); border-bottom: 1px solid var(--zr-ligne); transition: box-shadow var(--zr-t); }
.hdr.scrolled { box-shadow: var(--zr-shadow); }
.hdr__bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6px 8px; }
.hdr__left, .hdr__right { display: flex; align-items: center; }
.hdr__right { justify-content: flex-end; }
.hdr__desk-only { display: none; }
.logo { text-decoration: none; text-align: center; line-height: 1; color: var(--zr-marine); display: block; padding: 4px 0; }
.logo__crown { color: var(--zr-or); display: flex; align-items: center; justify-content: center; gap: 8px; }
.logo__crown::before, .logo__crown::after { content: ""; height: 1px; width: 28px; background: currentColor; opacity: .8; }
.logo b { display: block; font-family: var(--zr-font-titre); font-weight: 600; font-size: 22px; letter-spacing: 4px; margin-top: 3px; transition: font-size var(--zr-t); }
.logo em { display: block; font-style: normal; font-size: 9px; letter-spacing: 2.2px; margin-top: 4px; text-transform: uppercase; color: var(--zr-encre-2); transition: opacity var(--zr-t), height var(--zr-t); }
.count { position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--zr-or); color: var(--zr-marine); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.count:empty { display: none; }
.bump { animation: bump var(--zr-t-slow) var(--zr-ease); }
@keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.3) rotate(-8deg); } 60% { transform: scale(.95); } 100% { transform: scale(1); } }

.hdr__search { padding: 0 var(--zr-gutter) 10px; }
.search-field { position: relative; display: flex; align-items: center; gap: 10px; background: var(--zr-ivoire); border: 1px solid var(--zr-ligne-2); border-radius: 2px; padding: 0 12px; min-height: 46px; }
.search-field input { flex: 1; border: 0; background: transparent; font-size: 16px; outline: none; min-width: 0; }
.search-field input::placeholder { color: var(--zr-encre-2); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 var(--zr-gutter) 10px; scrollbar-width: none; scroll-snap-type: x proximity; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; min-height: 38px; padding: 0 14px; border-radius: 2px; background: var(--zr-creme); font-size: 14px; font-weight: 500; text-decoration: none; white-space: nowrap; border: 1px solid transparent; scroll-snap-align: start; }
.chip.on, .chip[aria-pressed="true"] { background: var(--zr-marine); color: var(--zr-blanc); }
.chip--promo { color: var(--zr-terracotta); font-weight: 700; }
.chip--saison { background: var(--zr-sable); font-weight: 700; }

/* Sur mobile, l'en-tête se compacte au défilement : la recherche reste, les raccourcis s'effacent */
@media (max-width: 1023px) {
  .hdr.scrolled > .chips, .hdr.scrolled .logo em, .hdr.scrolled .logo__crown { display: none; }
  .hdr.scrolled .logo b { margin-top: 0; }
  .hdr.scrolled .hdr__bar { padding-block: 2px; }
  body.has-cta .toasts { bottom: calc(var(--zr-tabbar-h) + 84px + env(safe-area-inset-bottom)); }
}

/* Suggestions de recherche */
.suggest { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--zr-blanc); border: 1px solid var(--zr-ligne); box-shadow: var(--zr-shadow); z-index: 60; max-height: 70vh; overflow: auto; display: none; }
.suggest.open { display: block; animation: fadeUp var(--zr-t) var(--zr-ease); }
.suggest a { display: flex; gap: 12px; align-items: center; padding: 10px 12px; text-decoration: none; border-bottom: 1px solid var(--zr-ligne); }
.suggest a:hover, .suggest a.active { background: var(--zr-creme); }
.suggest .thumb { width: 48px; height: 48px; background: var(--zr-tile-2); display: flex; align-items: center; justify-content: center; flex: none; }
.suggest small { color: var(--zr-encre-2); display: block; }
.suggest .hint { padding: 10px 12px; font-size: 13px; color: var(--zr-encre-2); }
.suggest mark { background: none; color: var(--zr-marine); font-weight: 700; }

/* Menu ordinateur + méga-menu */
.nav { display: none; }
@media (min-width: 1024px) {
  .hdr__bar { padding: 14px var(--zr-gutter); }
  .hdr__desk-only { display: flex; }
  .hdr__mob-only { display: none !important; }
  .logo b { font-size: 32px; letter-spacing: 6px; }
  .logo__crown::before, .logo__crown::after { width: 60px; }
  .logo em { font-size: 10.5px; letter-spacing: 3px; }
  .hdr.scrolled .logo b { font-size: 24px; }
  .hdr.scrolled .logo em { opacity: 0; height: 0; margin: 0; }
  .hdr__search, .hdr > .chips { display: none; }
  .hdr__left .search-field { width: 320px; }
  .hdr__left .search-field input { font-size: 15px; }
  .nav { display: flex; justify-content: center; gap: 4px; border-top: 1px solid var(--zr-ligne); position: relative; }
  .nav__item { position: static; }
  .nav__link { display: flex; align-items: center; height: 48px; padding: 0 16px; font-size: 14.5px; font-weight: 500; text-decoration: none; position: relative; }
  .nav__link::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: 10px; height: 1.5px; background: var(--zr-or); transform: scaleX(0); transition: transform var(--zr-t) var(--zr-ease); }
  .nav__item:hover .nav__link::after, .nav__link[aria-expanded="true"]::after, .nav__link.on::after { transform: scaleX(1); }
  .nav__link--promo { color: var(--zr-terracotta); font-weight: 700; }
  .nav__link--saison { color: var(--zr-or-700); font-weight: 700; }
  .mega { position: absolute; left: 0; right: 0; top: 100%; background: var(--zr-blanc); border-top: 1px solid var(--zr-ligne); box-shadow: 0 24px 40px -24px rgba(17, 28, 46, .35); opacity: 0; visibility: hidden; transform: translateY(-6px); transition: opacity var(--zr-t), transform var(--zr-t), visibility var(--zr-t); }
  .nav__item:hover .mega, .nav__item:focus-within .mega, .mega.open { opacity: 1; visibility: visible; transform: none; }
  .mega__in { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr) 260px; gap: 32px; padding: 28px 40px 32px; }
  .mega h4 { font-family: var(--zr-font-texte); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--zr-encre-2); margin-bottom: 12px; font-weight: 700; }
  .mega a { display: block; padding: 6px 0; text-decoration: none; font-size: 15px; }
  .mega a:hover { color: var(--zr-ardoise-700); }
  .mega a.mega__visual { display: flex; }
  .mega__visual { background: var(--zr-creme); border-radius: var(--zr-radius-arche); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-decoration: none; min-height: 220px; }
  .mega__visual span { font-family: var(--zr-font-titre); font-size: 22px; }
}

/* ---------- Barre fixe du bas (mobile) ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; height: calc(var(--zr-tabbar-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--zr-blanc); border-top: 1px solid var(--zr-ligne); display: grid; grid-template-columns: repeat(5, 1fr); }
.tabbar a, .tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; text-decoration: none; color: var(--zr-encre-2); position: relative; }
.tabbar .on { color: var(--zr-marine); font-weight: 700; }
.tabbar .on::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 2px; background: var(--zr-or); }
.tabbar .count { top: 6px; right: calc(50% - 22px); }
@media (min-width: 1024px) { .tabbar { display: none; } }

/* ---------- Sections ---------- */
main { min-height: 60vh; }
.sec { padding: 36px 0; }
.sec--creme { background: var(--zr-creme); }
.sec--marine { background: var(--zr-marine); color: var(--zr-creme); }
.sec__head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 18px; }
.sec__head h2 { font-size: var(--zr-fs-h2); }
.sec__head h2::after { content: ""; display: block; width: 36px; height: 1.5px; background: var(--zr-or); margin-top: 10px; }
.sec__intro { color: var(--zr-encre-2); margin: -6px 0 18px; max-width: 620px; }
.sec--marine .sec__intro { color: #C9D1DC; }
.sec--marine .stars { color: var(--zr-or); }
.sec--marine .stars span, .sec--marine .price s { color: #C9D1DC; }
.sec--marine .price .promo { color: #F2B4A2; }
.sec--marine .card__name { color: var(--zr-creme); }
.hscroll { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 calc(-1 * var(--zr-gutter)); padding: 0 var(--zr-gutter) 4px; scroll-padding: 0 var(--zr-gutter); }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll > * { scroll-snap-align: start; flex: none; }
@media (min-width: 1024px) { .sec { padding: 56px 0; } }

/* Héros */
.hero { position: relative; }
.hero__visual { position: relative; margin: 12px var(--zr-gutter) 0; height: 220px; border-radius: var(--zr-radius-arche); overflow: hidden; }
.lagoon { position: absolute; inset: 0; background: radial-gradient(120% 70% at 70% 0%, #F4E7C1 0%, transparent 55%), linear-gradient(180deg, #BFD9DE 0%, #7FB8BE 38%, #3E9AA3 60%, #E8DDBF 61%, #F2E9D0 100%); }
.hero__jewel { position: absolute; inset: 0 0 34% 0; display: flex; align-items: center; justify-content: center; animation: float 6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-6px); } }
.shine { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .55) 50%, transparent 65%); background-size: 250% 100%; animation: shine 4.5s ease-in-out infinite; mix-blend-mode: soft-light; }
@keyframes shine { 0% { background-position: 120% 0; } 60%, 100% { background-position: -120% 0; } }
.hero__copy { padding: 22px var(--zr-gutter) 8px; display: grid; gap: 12px; }
.hero__copy h1 { font-size: var(--zr-fs-h1); }
.hero__copy h1 i { color: var(--zr-ardoise-700); }
.hero__copy p { color: var(--zr-encre-2); display: none; }
@media (min-width: 768px) { .hero__copy p { display: block; } .hero__visual { height: 320px; } }
.hero__btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.hero__btns .btn { flex: 1 1 0; padding: 0 12px; }
@media (min-width: 1024px) {
  .hero { display: grid; grid-template-columns: 1fr 1fr; align-items: center; max-width: 1320px; margin: 0 auto; padding: 24px var(--zr-gutter) 8px; gap: 48px; }
  .hero__visual { order: 2; height: 460px; margin: 0; }
  .hero__copy { padding: 0; gap: 18px; }
  .hero__copy p { font-size: 17px; max-width: 460px; }
  .hero__btns .btn { flex: 0 0 auto; }
}

/* Réassurance */
.reassure { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; border-block: 1px solid var(--zr-ligne); background: var(--zr-blanc); margin-top: 20px; }
.reassure::-webkit-scrollbar { display: none; }
.reassure div { flex: none; display: flex; gap: 10px; align-items: center; padding: 14px 18px; font-size: 13px; line-height: 1.35; }
.reassure div + div { border-left: 1px solid var(--zr-ligne); }
.reassure b { display: block; font-size: 14px; }
.reassure span { color: var(--zr-encre-2); }
.reassure .ico { color: var(--zr-or-700); width: 26px; height: 26px; }
@media (min-width: 1024px) { .reassure { justify-content: center; } .reassure div { flex: 1; max-width: 330px; padding: 18px 24px; } }

/* Univers */
.univers { display: grid; grid-auto-flow: column; grid-auto-columns: 128px; gap: 12px; }
.univers a { text-decoration: none; text-align: center; font-weight: 500; font-size: 14px; }
.univers .ph { aspect-ratio: .82; border-radius: var(--zr-radius-arche); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; background: var(--zr-tile-1); transition: transform var(--zr-t) var(--zr-ease); }
.univers a:nth-child(2n) .ph { background: var(--zr-tile-2); }
.univers a:nth-child(3n) .ph { background: var(--zr-tile-3); }
.univers a:hover .ph { transform: translateY(-4px); }
@media (min-width: 1024px) { .univers { grid-auto-flow: row; grid-template-columns: repeat(7, 1fr); overflow: visible; } }

/* ---------- Cartes produit ---------- */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 12px; }
@media (min-width: 768px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1024px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px 24px; } }
.hscroll .card { width: 44vw; max-width: 260px; }
.card { position: relative; display: flex; flex-direction: column; }
.card__media { position: relative; aspect-ratio: 1; background: var(--zr-tile-1); border-radius: var(--zr-radius); overflow: hidden; display: block; }
.card:nth-child(4n+2) .card__media { background: var(--zr-tile-2); }
.card:nth-child(4n+3) .card__media { background: var(--zr-tile-3); }
.card:nth-child(4n+4) .card__media { background: var(--zr-tile-4); }
.card__art { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transition: transform var(--zr-t-slow) var(--zr-ease), opacity var(--zr-t); }
.card__art--alt { opacity: 0; transform: scale(1.06); }
@media (hover: hover) {
  .card:hover .card__art--main { transform: scale(1.06); }
  .card:hover .card__art--alt { opacity: 1; transform: scale(1); }
  .card:hover .card__art--alt ~ .card__art--main, .card__media:has(.card__art--alt):hover .card__art--main { opacity: 0; }
}
.card__badges { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.fav { position: absolute; top: 4px; right: 4px; width: var(--zr-touch); height: var(--zr-touch); display: flex; align-items: center; justify-content: center; }
.fav span { width: 32px; height: 32px; border-radius: 50%; background: var(--zr-blanc); display: flex; align-items: center; justify-content: center; }
.fav .ico { width: 17px; height: 17px; }
.fav[aria-pressed="true"] .ico { fill: var(--zr-terracotta); stroke: var(--zr-terracotta); }
.fav.pop .ico { animation: pop var(--zr-t-slow) var(--zr-ease); }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.45); } 70% { transform: scale(.9); } 100% { transform: scale(1); } }
.quick { position: absolute; right: 6px; bottom: 6px; width: 40px; height: 40px; border-radius: 50%; background: var(--zr-marine); color: var(--zr-blanc); display: flex; align-items: center; justify-content: center; box-shadow: var(--zr-shadow); transition: transform var(--zr-t-fast); }
.quick:active { transform: scale(.9); }
.quick .ico { width: 18px; height: 18px; }
.quick::before { content: ""; position: absolute; inset: -4px; } /* zone tactile de 48 px */
.card .badge { font-size: 10px; padding: 3px 6px; letter-spacing: .6px; }
@media (min-width: 1024px) { .card .badge { font-size: 11px; padding: 4px 8px; } .quick { opacity: 0; transform: translateY(6px); transition: opacity var(--zr-t), transform var(--zr-t); } .card:hover .quick, .quick:focus-visible { opacity: 1; transform: none; } }
.card__info { padding: 10px 2px 0; display: grid; gap: 3px; }
.card__name { font-size: 14.5px; font-weight: 500; text-decoration: none; line-height: 1.35; }
.card__name::after { content: ""; position: absolute; inset: 0; } /* toute la carte est cliquable */
.card .fav, .card .quick { z-index: 2; }
.card .price { font-size: 16px; }
@media (min-width: 1024px) { .card__name { font-size: 15px; } }

/* Squelettes de chargement */
.skel .card__media { background: linear-gradient(90deg, var(--zr-creme) 25%, var(--zr-tile-2) 50%, var(--zr-creme) 75%); background-size: 200% 100%; animation: skel 1.1s linear infinite; }
.skel .line { height: 12px; background: var(--zr-creme); margin-top: 10px; border-radius: 2px; }
.skel .line + .line { width: 50%; }
@keyframes skel { to { background-position: -200% 0; } }

/* Bloc personnalisation (accueil) */
.atelier { background: var(--zr-marine); color: var(--zr-creme); border-radius: var(--zr-radius); overflow: hidden; display: grid; }
.atelier__demo { min-height: 220px; display: flex; align-items: center; justify-content: center; background: radial-gradient(70% 70% at 50% 50%, rgba(255, 255, 255, .1), transparent); }
.atelier__txt { padding: 24px 20px 26px; display: grid; gap: 12px; }

.atelier .kicker { color: var(--zr-or); }
.atelier p { color: #C9D1DC; }
.atelier input { background: rgba(255, 255, 255, .08); border: 1px solid rgba(233, 224, 184, .4); color: var(--zr-blanc); min-height: 48px; padding: 0 14px; border-radius: 2px; font-size: 16px; width: 100%; }
.atelier input::placeholder { color: #AEB7C5; }
@media (min-width: 1024px) { .atelier { grid-template-columns: 1fr 1fr; } .atelier__txt { padding: 48px; order: -1; } }

/* Îles */
.iles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.iles a { text-decoration: none; padding: 8px 14px; border: 1px solid var(--zr-ligne-2); border-radius: 999px; font-size: 14px; background: var(--zr-blanc); }
.iles a:hover { background: var(--zr-marine); color: var(--zr-blanc); }

/* Vos créations, ambassadrices, avis, blog */
.creation { width: 62vw; max-width: 240px; text-decoration: none; }
.creation__card { aspect-ratio: 3 / 4; background: linear-gradient(160deg, #26304A, #121A2B); border-radius: var(--zr-radius); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--zr-sable); position: relative; overflow: hidden; }
.creation__card::before { content: "ZA RAHISSI"; font-family: var(--zr-font-titre); letter-spacing: 3px; font-size: 13px; position: absolute; top: 16px; }
.creation__card::after { content: "zarahissi.com"; font-size: 11px; letter-spacing: 1px; position: absolute; bottom: 14px; opacity: .7; }
.creation small { display: block; margin-top: 8px; font-size: 13px; color: var(--zr-encre-2); }
.amb { width: 40vw; max-width: 200px; }
.amb__vid { aspect-ratio: 9 / 16; border-radius: 120px 120px 6px 6px; background: linear-gradient(180deg, #8DA6B3, #3E5666); position: relative; display: flex; align-items: center; justify-content: center; color: var(--zr-blanc); overflow: hidden; }
.amb__vid .play { width: 52px; height: 52px; border-radius: 50%; background: rgba(255, 255, 255, .25); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; }
.amb p { font-size: 14px; margin-top: 8px; font-weight: 500; }
.avis { width: 78vw; max-width: 340px; background: var(--zr-blanc); border: 1px solid var(--zr-ligne); padding: 20px; border-radius: var(--zr-radius); display: grid; gap: 10px; align-content: start; }
.avis blockquote { margin: 0; font-family: var(--zr-font-titre); font-size: 20px; line-height: 1.3; }
.avis small { color: var(--zr-encre-2); }
.score { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.score b { font-family: var(--zr-font-titre); font-size: 44px; line-height: 1; }
.blog { width: 72vw; max-width: 340px; text-decoration: none; }
.blog .ph { aspect-ratio: 16 / 10; background: var(--zr-tile-2); display: flex; align-items: center; justify-content: center; border-radius: var(--zr-radius); }
.blog h3 { font-size: 20px; margin-top: 10px; }
.blog small { color: var(--zr-encre-2); }
@media (min-width: 1024px) { .hscroll--grid { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 24px; overflow: visible; margin: 0; padding: 0; } .hscroll--grid > *, .hscroll--grid .card { width: auto; max-width: none; } }

/* Histoire */
.histoire { display: grid; gap: 24px; align-items: center; }
.histoire__img { aspect-ratio: 4 / 3; border-radius: var(--zr-radius-arche); overflow: hidden; position: relative; }
.histoire p { color: var(--zr-encre-2); }
@media (min-width: 1024px) { .histoire { grid-template-columns: 1fr 1fr; gap: 64px; } }

/* Newsletter */
.news form { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.news input { flex: 1 1 220px; min-height: 48px; border: 1px solid var(--zr-ligne-2); padding: 0 14px; font-size: 16px; background: var(--zr-blanc); border-radius: 2px; }

/* ---------- Pied de page ---------- */
.foot { background: var(--zr-marine-900); color: #D5DBE4; padding: 40px 0 28px; font-size: 14px; }
.foot .logo { color: var(--zr-creme); text-align: left; display: inline-block; }
.foot .logo em { color: #AEB7C5; }
.foot__cols { display: grid; gap: 0; margin-top: 24px; }
.foot details { border-bottom: 1px solid rgba(255, 255, 255, .12); }
.foot summary { list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 52px; font-weight: 700; color: var(--zr-creme); cursor: pointer; }
.foot summary::-webkit-details-marker { display: none; }
.foot details[open] summary .ico { transform: rotate(180deg); }
.foot summary .ico { transition: transform var(--zr-t); }
.foot ul { list-style: none; margin: 0; padding: 0 0 14px; }
.foot li a { display: block; padding: 7px 0; text-decoration: none; }
.foot li a:hover { color: var(--zr-sable); }
.foot__bottom { margin-top: 26px; display: grid; gap: 12px; font-size: 12.5px; color: #9AA5B5; }
.pay { display: flex; gap: 6px; flex-wrap: wrap; }
.pay span { border: 1px solid rgba(255, 255, 255, .25); border-radius: 3px; padding: 3px 8px; font-size: 11px; font-weight: 700; color: #D5DBE4; }
@media (min-width: 1024px) {
  .foot__cols { grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 40px; }
  .foot details { border: 0; }
  .foot summary { pointer-events: none; min-height: 0; margin-bottom: 12px; }
  .foot summary .ico { display: none; }
}

/* ---------- Page catégorie ---------- */
.crumbs { display: none; font-size: 13px; color: var(--zr-encre-2); padding-top: 20px; }
.crumbs a { text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
@media (min-width: 1024px) { .crumbs { display: block; } }
.cat-head { padding: 20px 0 6px; }
.cat-head h1 { font-size: var(--zr-fs-h1); }
.cat-head p { color: var(--zr-encre-2); margin-top: 6px; }
.toolbar { position: sticky; top: var(--hdr-h, 112px); z-index: 30; background: rgba(251, 248, 241, .96); backdrop-filter: blur(6px); display: flex; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--zr-ligne); margin-bottom: 18px; }
.toolbar .btn { min-height: 42px; padding: 0 14px; font-size: 14px; }
.toolbar select { min-height: 42px; border: 1px solid var(--zr-marine); background: transparent; padding: 0 10px; font-size: 14px; border-radius: 2px; }
.toolbar .n { margin-left: auto; font-size: 13px; color: var(--zr-encre-2); }
.active-filters { display: flex; gap: 6px; flex-wrap: wrap; margin: -6px 0 16px; }
.active-filters button { font-size: 13px; padding: 6px 10px; background: var(--zr-creme); border-radius: 999px; }
.empty { text-align: center; padding: 48px 16px; color: var(--zr-encre-2); display: grid; gap: 16px; justify-items: center; }

/* ---------- Tiroirs et fenêtres ---------- */
.scrim { position: fixed; inset: 0; background: rgba(17, 28, 46, .45); z-index: 70; opacity: 0; transition: opacity var(--zr-t); }
.scrim.open { opacity: 1; }
.sheet { position: fixed; z-index: 80; background: var(--zr-ivoire); display: flex; flex-direction: column; transition: transform var(--zr-t) var(--zr-ease); }
.sheet[hidden] { display: none; }
.sheet--right { top: 0; right: 0; bottom: 0; width: min(420px, 100%); transform: translateX(100%); }
.sheet--left { top: 0; left: 0; bottom: 0; width: 100%; transform: translateX(-100%); }
.sheet--bottom { left: 0; right: 0; bottom: 0; max-height: 88vh; border-radius: 16px 16px 0 0; transform: translateY(100%); }
.sheet.open { transform: none; }
.sheet__head { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px var(--zr-gutter); border-bottom: 1px solid var(--zr-ligne); min-height: 60px; }
.sheet__head h2 { font-size: 24px; }
.sheet__body { flex: 1; overflow: auto; padding: var(--zr-gutter); }
.sheet__foot { padding: 12px var(--zr-gutter) calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--zr-ligne); background: var(--zr-blanc); display: grid; gap: 10px; }
@media (min-width: 1024px) { .sheet--left { width: 420px; } .sheet--bottom { left: auto; right: 0; top: 0; bottom: 0; width: 400px; max-height: none; border-radius: 0; transform: translateX(100%); } .sheet--bottom.open { transform: none; } }

/* Menu burger */
.mnav { list-style: none; margin: 0; padding: 0; }
.mnav > li { border-bottom: 1px solid var(--zr-ligne); }
.mnav__row { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 60px; text-decoration: none; font-family: var(--zr-font-titre); font-size: 24px; font-weight: 600; text-align: left; gap: 12px; }
.mnav__row .thumb { width: 44px; height: 44px; border-radius: 22px 22px 3px 3px; background: var(--zr-creme); display: flex; align-items: center; justify-content: center; flex: none; }
.mnav__row span { flex: 1; }
.mnav__row .ico { transition: transform var(--zr-t); }
.mnav__row[aria-expanded="true"] .ico { transform: rotate(180deg); }
.mnav__sub { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--zr-t) var(--zr-ease); }
.mnav__sub.open { grid-template-rows: 1fr; }
.mnav__sub > div { overflow: hidden; }
.mnav__sub h4 { font-family: var(--zr-font-texte); font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--zr-encre-2); margin: 10px 0 2px; }
.mnav__sub a { display: flex; align-items: center; min-height: 44px; text-decoration: none; font-size: 16px; padding-left: 4px; }
.mnav__sub .all { font-weight: 700; text-decoration: underline; text-decoration-color: var(--zr-or); text-underline-offset: 4px; }
.mnav__sub > div > div { padding-bottom: 12px; }
.mnav .promo { color: var(--zr-terracotta); }
.mnav .saison { color: var(--zr-or-700); }
.minfo { margin-top: 24px; display: grid; gap: 4px; }
.minfo h4 { font-family: var(--zr-font-texte); font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--zr-encre-2); margin: 8px 0 4px; }
.minfo a { display: flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; }

/* Panier */
.gauge { background: var(--zr-creme); padding: 12px 14px; border-radius: var(--zr-radius); font-size: 14px; margin-bottom: 16px; }
.gauge__bar { height: 6px; background: var(--zr-blanc); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.gauge__bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--zr-or), var(--zr-ardoise)); border-radius: 3px; transition: width var(--zr-t-slow) var(--zr-ease); }
.gauge b { color: var(--zr-marine); }
.line { display: grid; grid-template-columns: 80px 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--zr-ligne); animation: fadeUp var(--zr-t) var(--zr-ease); }
.line__img { width: 80px; height: 80px; background: var(--zr-tile-2); display: flex; align-items: center; justify-content: center; border-radius: var(--zr-radius); }
.line__name { font-weight: 500; font-size: 15px; text-decoration: none; }
.line__opts { font-size: 13px; color: var(--zr-encre-2); }
.line__row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--zr-ligne-2); border-radius: 2px; }
.qty button { width: 40px; height: 40px; font-size: 18px; }
.qty span { min-width: 24px; text-align: center; font-weight: 700; }
.rm { font-size: 13px; text-decoration: underline; color: var(--zr-encre-2); min-height: 40px; padding: 0 4px; }
.totals { display: grid; gap: 6px; font-size: 15px; }
.totals div { display: flex; justify-content: space-between; }
.totals .grand { font-size: 18px; font-weight: 700; padding-top: 6px; border-top: 1px solid var(--zr-ligne); }
.totals .disc { color: var(--zr-succes); }

/* Filtres */
.fgroup { padding: 14px 0; border-bottom: 1px solid var(--zr-ligne); }
.fgroup h3 { font-family: var(--zr-font-texte); font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
.fgroup .opts { display: flex; flex-wrap: wrap; gap: 8px; }
.fgroup input[type=range] { width: 100%; accent-color: var(--zr-marine); height: 44px; }
.toggle { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--zr-marine); }
.metal-dot { width: 18px; height: 18px; border-radius: 50%; display: inline-block; margin-right: 6px; border: 1px solid rgba(0, 0, 0, .1); }

/* Zoom */
.zoom { position: fixed; inset: 0; z-index: 90; background: var(--zr-ivoire); display: flex; align-items: center; justify-content: center; touch-action: pinch-zoom; }
.zoom[hidden] { display: none; }
.zoom .close { position: absolute; top: 12px; right: 12px; }
.zoom__art { transform: scale(1.8); animation: zoomIn var(--zr-t) var(--zr-ease); }
@keyframes zoomIn { from { transform: scale(1); opacity: .4; } }

/* Toast */
.toasts { position: fixed; left: 50%; bottom: calc(var(--zr-tabbar-h) + 16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 100; display: grid; gap: 8px; width: min(420px, calc(100% - 32px)); }
.toast { background: var(--zr-marine); color: var(--zr-blanc); padding: 12px 16px; border-radius: 4px; display: flex; gap: 10px; align-items: center; justify-content: space-between; box-shadow: var(--zr-shadow); font-size: 14px; animation: fadeUp var(--zr-t) var(--zr-ease); }
.toast a, .toast button { color: var(--zr-sable); font-weight: 700; text-decoration: underline; min-height: 32px; }
.toast.out { opacity: 0; transform: translateY(8px); transition: all var(--zr-t); }

/* ---------- Fiche produit ---------- */
.pdp { display: grid; }
.gal { position: relative; margin: 0 calc(-1 * var(--zr-gutter)); }
.gal__track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.gal__track::-webkit-scrollbar { display: none; }
.gal__slide { flex: 0 0 100%; aspect-ratio: 1; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; background: var(--zr-tile-2); position: relative; cursor: zoom-in; }
.gal__slide:nth-child(2) { background: var(--zr-tile-1); }
.gal__slide:nth-child(3) { background: linear-gradient(160deg, #26304A, #121A2B); }
.gal__dots { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
.gal__dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--zr-marine); opacity: .25; transition: all var(--zr-t); }
.gal__dots i.on { width: 20px; opacity: .9; }
.gal__thumbs { display: none; }
.gal .fav { top: 10px; right: 10px; }
.pdp__info { padding-top: 16px; display: grid; gap: 10px; align-content: start; }
.pdp__info h1 { font-size: 30px; }
.pdp__price { font-size: 24px; }
.pdp__badges { display: flex; gap: 6px; flex-wrap: wrap; }
.opt { margin-top: 8px; }
.opt__label { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--zr-encre-2); margin-bottom: 8px; }
.opt__label a { text-transform: none; letter-spacing: 0; font-weight: 500; }
.field { display: flex; align-items: center; border: 1.5px solid var(--zr-marine); background: var(--zr-blanc); border-radius: 2px; min-height: 50px; padding: 0 14px; gap: 8px; }
.field input, .field textarea, .field select { flex: 1; border: 0; outline: none; background: transparent; font-size: 16px; min-width: 0; }
.field textarea { padding: 12px 0; resize: vertical; min-height: 80px; }
.field small { color: var(--zr-encre-2); font-size: 12px; }
.field.err { border-color: var(--zr-terracotta); }
.ferr { color: var(--zr-terracotta); font-size: 13px; margin-top: 4px; }
.fields-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.segs { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { flex: 1; min-height: 50px; min-width: 64px; border: 1px solid var(--zr-ligne-2); background: var(--zr-blanc); border-radius: 2px; font-size: 18px; padding: 0 10px; transition: border-color var(--zr-t-fast); }
.seg[aria-pressed="true"] { border: 1.5px solid var(--zr-marine); box-shadow: inset 0 0 0 1px var(--zr-marine); }
.seg small { display: block; font-size: 11px; font-family: var(--zr-font-texte); color: var(--zr-encre-2); }
.swatches { display: flex; gap: 12px; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--zr-blanc); box-shadow: 0 0 0 1px var(--zr-ligne-2); transition: box-shadow var(--zr-t-fast); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--zr-marine); }
.preview { background: var(--zr-creme); border-radius: var(--zr-radius); display: flex; align-items: center; justify-content: center; min-height: 170px; position: relative; overflow: hidden; }
.preview::before { content: "Aperçu en direct"; position: absolute; top: 10px; left: 12px; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--zr-encre-2); }
.ship-box { background: var(--zr-creme); padding: 12px 14px; border-radius: var(--zr-radius); font-size: 14px; display: grid; gap: 8px; }
.ship-box select { border: 1px solid var(--zr-ligne-2); background: var(--zr-blanc); min-height: 44px; padding: 0 10px; border-radius: 2px; font-size: 15px; }
.ship-box ul { margin: 0; padding-left: 18px; }
.acc { border-top: 1px solid var(--zr-ligne); }
.acc:last-of-type { border-bottom: 1px solid var(--zr-ligne); }
.acc summary { list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 54px; font-weight: 700; cursor: pointer; }
.acc summary::-webkit-details-marker { display: none; }
.acc[open] summary .ico { transform: rotate(180deg); }
.acc summary .ico { transition: transform var(--zr-t); }
.acc > div { padding-bottom: 16px; color: var(--zr-encre-2); font-size: 15px; display: grid; gap: 8px; }
.sticky-cta { position: fixed; left: 0; right: 0; bottom: calc(var(--zr-tabbar-h) + env(safe-area-inset-bottom)); z-index: 44; background: var(--zr-blanc); border-top: 1px solid var(--zr-ligne); padding: 10px var(--zr-gutter); display: flex; gap: 10px; align-items: center; transform: translateY(0); transition: transform var(--zr-t); }
.sticky-cta .btn { flex: 1; min-height: 52px; }
.sticky-cta .price { flex-direction: column; gap: 0; line-height: 1.2; font-size: 18px; }
.pdp-page { padding-bottom: 80px; }
@media (min-width: 1024px) {
  .pdp { grid-template-columns: 1.1fr 1fr; gap: 56px; padding-top: 12px; }
  .gal { margin: 0; display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: start; }

/* =========================================================================

   les vraies photos produits (fond uni crème, format carré 1:1) qui
   prennent leur place.
   art(visuel, { s, metal, text, text2, font, ile, alt })
   ========================================================================= */
function art(v, o = {}) {
  const s = o.s || 140;
  const m = (METAUX[o.metal] || METAUX.or).couleur;
  const ink = '#1B2A41';
  const esc = (t) => String(t || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const font = o.font || POLICES[0];
  const ff = `font-family:${font.css.replace(/"/g, "'")};${font.style ? 'font-style:' + font.style + ';' : ''}${font.poids ? 'font-weight:' + font.poids + ';' : ''}`;
  // Taille du texte gravé : s'adapte à la longueur pour rester dans le bijou
  const fit = (t, base, width) => {
    const n = Math.max(String(t || '').length, 1);
    return Math.min(base, (width / (n * .5)) ) * font.taille;
  };
  const chain = (y = 108) => `<path d="M24 22 Q100 ${y + 70} 176 22" fill="none" stroke="${m}" stroke-width="1.6"/>`;
  const sh = 'fill="#fff" opacity=".35"';
  const svg = (inner) => `<svg width="${s}" height="${s}" viewBox="0 0 200 200" aria-hidden="true" role="img">${inner}</svg>`;
  const T = o.text ?? '', T2 = o.text2 ?? '';

  switch (v) {
    case 'nom': {
      const t = T || 'Amina';
      return svg(`<path d="M24 22 Q40 90 54 118" fill="none" stroke="${m}" stroke-width="1.6"/><path d="M176 22 Q160 90 146 118" fill="none" stroke="${m}" stroke-width="1.6"/>
        <text x="100" y="134" text-anchor="middle" style="${ff}" font-size="${fit(t, 54, 150)}" fill="${m}">${esc(t)}</text>`);
    }
    case 'coeur': {
      const t = T || 'Chafia';
      return svg(`${chain(40)}<path d="M100 170 C40 130 40 70 74 66 C90 64 98 74 100 82 C102 74 110 64 126 66 C160 70 160 130 100 170Z" fill="none" stroke="${m}" stroke-width="4"/>
        <text x="100" y="128" text-anchor="middle" style="${ff}" font-size="${fit(t, 36, 96)}" fill="${m}">${esc(t)}</text>`);
    }
    case 'plaque': {
      const t = T || 'Houssam';
      return svg(`${chain(30)}<rect x="66" y="78" width="68" height="104" rx="16" fill="${o.metal === 'or' ? m : '#3A4252'}" stroke="${m}" stroke-width="3"/><circle cx="100" cy="90" r="4" fill="#fff" opacity=".6"/>
        <text x="100" y="140" text-anchor="middle" transform="rotate(-90 100 134)" style="${ff}" font-size="${fit(t, 26, 86)}" fill="${o.metal === 'or' ? ink : '#E9E0B8'}">${esc(t)}</text>`);
    }
    case 'duo-plaque': {
      const a = T || 'Houssam', b = T2 || 'Kamela';
      const pl = (x, t) => `<rect x="${x}" y="70" width="54" height="92" rx="13" fill="#2A3243" stroke="${m}" stroke-width="2.5"/><path d="M${x + 12} 96 l5 -12 l10 8 l10 -8 l5 12z" fill="${m}"/>
        <text x="${x + 27}" y="130" text-anchor="middle" style="${ff}" font-size="${fit(t, 18, 48)}" fill="#E9E0B8">${esc(t)}</text>`;
      return svg(`<path d="M30 20 Q50 60 60 70 M110 70 Q130 30 140 20 M60 20 Q80 50 88 70 M140 70 Q160 40 170 20" fill="none" stroke="${m}" stroke-width="1.4"/>${pl(36, a)}${pl(110, b)}`);
    }
    case 'pieds': {
      const a = T || 'Aaliyah', b = T2 || 'Ilyes';
      const foot = (x, r, t) => `<g transform="rotate(${r} ${x} 120)"><ellipse cx="${x}" cy="126" rx="22" ry="38" fill="${m}"/>${[0, 1, 2, 3, 4].map(i => `<circle cx="${x - 16 + i * 8}" cy="${82 - (i === 0 ? 4 : 0)}" r="${i === 0 ? 6 : 4}" fill="${m}"/>`).join('')}
        <text x="${x}" y="130" text-anchor="middle" transform="rotate(-90 ${x} 126)" style="${ff}" font-size="${fit(t, 14, 60)}" fill="${ink}">${esc(t)}</text></g>`;
      return svg(`${chain(10)}${foot(78, -8, a)}${foot(122, 8, b)}`);
    }
    case 'jonc':
    case 'cuir':
    case 'barre': {
      const t = T || (v === 'cuir' ? 'Ibrahim' : 'Inaya');
      const band = v === 'cuir' ? `<ellipse cx="100" cy="110" rx="78" ry="40" fill="none" stroke="#2B2B2B" stroke-width="9" stroke-dasharray="6 3"/>` : `<path d="M30 110 A70 38 0 1 0 170 110" fill="none" stroke="${m}" stroke-width="7"/><path d="M30 110 A70 38 0 0 1 64 78" fill="none" stroke="${m}" stroke-width="7"/>`;
      return svg(`${band}<rect x="48" y="128" width="104" height="30" rx="4" fill="${m}"/><rect x="48" y="128" width="104" height="8" rx="4" ${sh}/>
        <text x="100" y="150" text-anchor="middle" style="${ff}" font-size="${fit(t, 22, 92)}" fill="${ink}">${esc(t)}</text>`);
    }
    case 'duo-bracelet':
      return svg(`<ellipse cx="78" cy="104" rx="52" ry="30" fill="none" stroke="#2B2B2B" stroke-width="7"/><ellipse cx="122" cy="112" rx="52" ry="30" fill="none" stroke="${m}" stroke-width="7"/>
        ${T || T2 ? `<rect x="40" y="128" width="58" height="22" rx="3" fill="${m}"/><rect x="104" y="128" width="58" height="22" rx="3" fill="${m}"/>
        <text x="69" y="144" text-anchor="middle" style="${ff}" font-size="${fit(T || 'Lui', 15, 52)}" fill="${ink}">${esc(T || 'Lui')}</text><text x="133" y="144" text-anchor="middle" style="${ff}" font-size="${fit(T2 || 'Elle', 15, 52)}" fill="${ink}">${esc(T2 || 'Elle')}</text>` : ''}`);

<script>
/* =========================================================================
   Zarahissi 2027 · Prototype cliquable
   Application monopage en JavaScript sans dépendance. Routes (hash) :
     #/                    accueil
     #/c/:categorie?pour=  page catégorie (filtres, tri)
     #/p/:produit          fiche produit (personnalisation avec aperçu)
     #/recherche?q=        recherche
     #/favoris             favoris
     #/commande            tunnel de commande (zone, livraison, paiement)
     #/compte              compte, suivi de commande, fidélité
     #/infos/:page         livraison, paiement, faq, histoire, contact…
   Correspondance Wix Studio : voir docs/03-prototype-et-wix-studio.md
   ========================================================================= */
(() => {
'use strict';

/* ---------- Utilitaires ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const eur = (n) => n.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9€ ]/g, ' ');
const ico = (id, cls = 'ico') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const byId = Object.fromEntries(PRODUITS.map(p => [p.id, p]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('zr-' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('zr-' + k, JSON.stringify(v)); } catch { /* navigation privée */ } },
};

/* ---------- État ---------- */
const state = {
  cart: store.get('cart', []),
  favs: new Set(store.get('favs', [])),
  zone: store.get('zone', 'mayotte'),
  co: { step: 1, zone: null, mode: null, info: {}, pay: null },
};
const saveCart = () => { store.set('cart', state.cart); updateCounts(); };
const saveFavs = () => { store.set('favs', [...state.favs]); updateCounts(); };

/* ---------- Prix, remises et livraison ---------- */
function totals(modeId, zoneId) {
  const sub = state.cart.reduce((s, l) => s + l.prix * l.qty, 0);
  const palier = [...BOUTIQUE.paliers].reverse().find(p => sub >= p.des);
  const remise = palier ? palier.remise : 0;
  let port = null;
  if (modeId) {
    const zone = ZONES.find(z => z.id === zoneId);
    const mode = zone && zone.modes.find(m => m.id === modeId);
    port = mode ? (sub >= BOUTIQUE.livraisonOfferteDes ? 0 : mode.prix) : null;
  }
  return { sub, remise, port, total: Math.max(0, sub - remise + (port || 0)) };
}
function gaugeHTML(sub) {
  const steps = [{ des: BOUTIQUE.livraisonOfferteDes, txt: 'la livraison offerte' }, ...BOUTIQUE.paliers.map(p => ({ des: p.des, txt: `−${p.remise} € sur ta commande` }))];
  const next = steps.find(s => sub < s.des);
  const max = steps[steps.length - 1].des;
  const pct = Math.min(100, sub / max * 100);
  const msg = next
    ? `Plus que <b>${eur(next.des - sub)}</b> pour ${next.txt}`
    : `<b>Bravo !</b> Livraison offerte et −${BOUTIQUE.paliers.at(-1).remise} € appliqués automatiquement.`;
  const ticks = steps.map(s => `<span style="position:absolute;left:${s.des / max * 100}%;top:-2px;width:2px;height:10px;background:var(--zr-marine);opacity:.35"></span>`).join('');
  return `<div class="gauge" role="status">${msg}<div class="gauge__bar" style="position:relative"><i style="width:${pct}%"></i>${ticks}</div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--zr-encre-2);margin-top:4px"><span>Livraison offerte dès ${BOUTIQUE.livraisonOfferteDes} €</span><span>−5 € dès 70 € · −10 € dès 100 €</span></div></div>`;
}

/* ---------- Recherche tolérante aux fautes ---------- */
const STOP = new Set(['de', 'la', 'le', 'les', 'un', 'une', 'pour', 'des', 'd', 'l', 'en', 'a', 'au', 'aux', 'et', 'avec', 'mon', 'ma', 'mes']);
const stem = (w) => w.length > 3 ? w.replace(/(x|s)$/, '') : w;
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
const hay = {};
PRODUITS.forEach(p => {
  const c = CATS[p.cat] || {};
  const words = [p.nom, c.titre, c.parent && CATS[c.parent].titre, p.collection === 'iles' ? 'iles ile' : p.collection, p.ile, ...(p.pour || []),
    ...p.occasions.map(o => OCCASIONS[o]), p.perso ? 'personnalise personnalisable grave gravure prenom nom' : '', p.ancien ? 'promo bon plan petit prix' : '', p.nouveau ? 'nouveau nouveaute' : '',
    p.metaux ? p.metaux.map(m => METAUX[m].nom).join(' ') + ' or argent' : ''].join(' ');
  hay[p.id] = [...new Set(norm(words).split(/\s+/).filter(Boolean).map(stem))];
});
function search(q) {
  let n = norm(q);
  let max = null;
  const b = n.match(/(?:moins de|max|<)\s*(\d+)|(\d+)\s*(?:€|euros?)/);
  if (b) { max = +(b[1] || b[2]); n = n.replace(b[0], ' '); }
  const toks = n.split(/\s+/).filter(t => t && !STOP.has(t) && !/^\d+$/.test(t)).map(stem);
  const res = [];
  PRODUITS.forEach(p => {
    if (max && p.prix > max) return;
    let score = 0;
    for (const t of toks) {
      const words = hay[p.id];
      let best = 0;
      for (const w of words) {
        if (w === t) { best = 4; break; }
        if (w.startsWith(t)) best = Math.max(best, 3);
        else if (t.length >= 4) {
          const tol = t.length > 6 ? 2 : 1;
          if (lev(t, w.slice(0, t.length)) <= tol || lev(t, w) <= tol) best = Math.max(best, 1.5);
        }
      }
      if (!best) return; // chaque mot doit trouver une correspondance
      score += best;
    }
    if (!toks.length && !max) return;
    if (norm(p.nom).includes(norm(q).trim())) score += 3;
    res.push({ p, score: score + (p.best ? .5 : 0) });
  });
  return res.sort((a, b) => b.score - a.score).map(r => r.p);
}
function searchCats(q) {
  const n = norm(q).trim();
  if (n.length < 2) return [];
  return Object.entries(CATS).filter(([, c]) => norm(c.titre).includes(n) || lev(n, norm(c.titre).slice(0, n.length)) <= (n.length > 4 ? 1 : 0)).slice(0, 3);
}
const hl = (txt, q) => {
  const toks = norm(q).split(/\s+/).filter(t => t.length > 1);
  return esc(txt).split(' ').map(w => toks.some(t => norm(w).startsWith(t)) ? `<mark>${w}</mark>` : w).join(' ');
};

/* ---------- Composants ---------- */
const stars = (n, avis) => `<div class="stars" aria-label="Note ${String(n).replace('.', ',')} sur 5, ${avis} avis">${'★'.repeat(Math.round(n))}${'☆'.repeat(5 - Math.round(n))}<span>(${avis})</span></div>`;
const priceHTML = (p, prix = p.prix) => `<div class="price">${p.ancien ? `<span class="promo">${eur(prix)}</span><s>${eur(p.ancien)}</s>` : `<span>${p.montants ? 'dès ' + eur(p.montants[0]) : eur(prix)}</span>`}</div>`;
function badges(p) {
  const b = [];
  if (p.perso) b.push('<span class="badge badge--perso">Personnalisable</span>');
  if (p.nouveau) b.push('<span class="badge badge--new">Nouveau</span>');
  if (p.ancien) b.push(`<span class="badge badge--promo">−${Math.round((1 - p.prix / p.ancien) * 100)} %</span>`);
  else if (p.prix < 10) b.push('<span class="badge">Petit prix</span>');
  return b.slice(0, 2).join('');
}
const artOf = (p, o = {}) => art(p.visuel, { ile: p.ile, metal: p.metaux ? p.metaux[0] : 'or', text: p.montants ? eur(p.prix).replace(',00', '') : undefined, ...o });
function card(p) {
  const alt = p.metaux && p.metaux[1] ? `<span class="card__art card__art--alt">${artOf(p, { metal: p.metaux[1], s: 128 })}</span>` : '';
  return `<article class="card reveal">
    <div class="card__media">${alt}<span class="card__art card__art--main">${artOf(p, { s: 128 })}</span>
      <div class="card__badges">${badges(p)}</div>

      <button class="quick" data-quick="${p.id}" aria-label="${p.perso || p.montants ? 'Personnaliser' : 'Ajouter au panier'} : ${esc(p.nom)}">${ico(p.perso || p.montants ? 'pen' : 'plus')}</button>
    </div>

      <a class="card__name" href="#/p/${p.id}">${esc(p.nom)}</a>

    </div>
  </article>`;
}
const skeletons = (n) => Array.from({ length: n }, () => `<div class="card skel" aria-hidden="true"><div class="card__media"></div><div class="line"></div><div class="line"></div></div>`).join('');
const secHead = (titre, lien, txt = 'Tout voir') => `<div class="sec__head"><h2>${titre}</h2>${lien ? `<a class="link" href="${lien}">${txt}</a>` : ''}</div>`;

/* ---------- Mise en page globale ---------- */
function renderAnnounce() {
  const msgs = [`Livraison offerte dès ${BOUTIQUE.livraisonOfferteDes} € d’achat`, '✨ Notre site fait peau neuve !', 'Retrait gratuit à Mamoudzou', 'Livré à Mayotte, Réunion, Antilles, France'];

  setInterval(() => {
    const ps = $$('p', el);
    ps[i].className = 'off';
    i = (i + 1) % ps.length;

    setTimeout(() => ps.forEach((p, k) => { if (k !== i) p.className = ''; }), 650);
  }, 4500);
}
function renderChips() {
  $('#chips').innerHTML = [
    `<a class="chip chip--saison" href="${catLink(SAISON.slug)}">${SAISON.titre}</a>`,
    `<a class="chip" href="${catLink('nouveautes')}">Nouveautés</a>`,

function mountSearch() {
  $$('[data-search-host]').forEach((host, k) => {
    host.innerHTML = `<form class="search-field" role="search" action="#/recherche">
      ${ico('search')}<label class="sr-only" for="q${k}">Rechercher</label>
      <input id="q${k}" type="search" name="q" placeholder="Rechercher un bijou, un prénom…" autocomplete="off" aria-autocomplete="list" aria-controls="sg${k}" aria-expanded="false">
      <div class="suggest" id="sg${k}" role="listbox"></div></form>`;
    const input = $('input', host), box = $('.suggest', host), form = $('form', host);
    let idx = -1;
    const close = () => { box.classList.remove('open'); input.setAttribute('aria-expanded', 'false'); idx = -1; };
    input.addEventListener('input', () => {
      const q = input.value.trim();
      if (q.length < 2) return close();
      const ps = search(q).slice(0, 5), cs = searchCats(q);
      box.innerHTML = (cs.map(([s, c]) => `<a href="${catLink(s)}" role="option"><span class="thumb">${ico('grid')}</span><span>${hl(c.titre, q)}<small>Catégorie</small></span></a>`).join('')
        + ps.map(p => `<a href="#/p/${p.id}" role="option"><span class="thumb">${artOf(p, { s: 44 })}</span><span>${hl(p.nom, q)}<small>${eur(p.prix)}${p.perso ? ' · personnalisable' : ''}</small></span></a>`).join(''))
        || `<p class="hint">Aucun résultat pour « ${esc(q)} ». Essaie « collier », « prénom », « Mayotte »…</p>`;
      if (ps.length) box.innerHTML += `<a href="#/recherche?q=${encodeURIComponent(q)}" role="option"><span class="thumb">${ico('search')}</span><span><b>Voir les ${search(q).length} résultats</b></span></a>`;
      box.classList.add('open'); input.setAttribute('aria-expanded', 'true');
    });
    input.addEventListener('keydown', (e) => {
      const opts = $$('a', box);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault(); if (!opts.length) return;
        idx = (idx + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length;
        opts.forEach((o, i) => o.classList.toggle('active', i === idx));
      } else if (e.key === 'Escape') close();
      else if (e.key === 'Enter' && idx >= 0) { e.preventDefault(); location.hash = opts[idx].getAttribute('href'); close(); input.blur(); }
    });
    form.addEventListener('submit', (e) => { e.preventDefault(); close(); input.blur(); location.hash = '#/recherche?q=' + encodeURIComponent(input.value.trim()); });
    document.addEventListener('click', (e) => { if (!host.contains(e.target)) close(); });
    box.addEventListener('click', () => { close(); input.value = ''; });
  });
}

  $$(`[aria-controls="${id}"]`).forEach(b => b.setAttribute('aria-expanded', 'true'));

function closeSheets(silent) {
  const open = $$('.sheet.open');
  if (!open.length) return;
  open.forEach(sh => {
    sh.classList.remove('open');
    $$(`[aria-controls="${sh.id}"]`).forEach(b => b.setAttribute('aria-expanded', 'false'));
    setTimeout(() => { if (!sh.classList.contains('open')) sh.hidden = true; }, 360);
  });

  setTimeout(() => { if (!$('.sheet.open')) scrim.hidden = true; }, 360);

/* ---------- Filtres de catégorie ---------- */
let filt = null;
const freshFilters = (params) => ({ max: 40, metaux: new Set(), pour: new Set(params.get('pour') ? [params.get('pour')] : []), perso: false, nouveau: false, promo: false, sort: 'pertinence' });
function applyFilters(list, f) {
  let r = list.filter(p => p.prix <= f.max
    && (!f.metaux.size || (p.metaux && p.metaux.some(m => f.metaux.has(m))))
    && (!f.pour.size || p.pour.some(x => f.pour.has(x)))
    && (!f.perso || p.perso) && (!f.nouveau || p.nouveau) && (!f.promo || p.ancien));
  const s = { 'prix-asc': (a, b) => a.prix - b.prix, 'prix-desc': (a, b) => b.prix - a.prix, 'avis': (a, b) => b.avis - a.avis, 'nouveautes': (a, b) => (b.nouveau ? 1 : 0) - (a.nouveau ? 1 : 0) }[f.sort];
  if (s) r = [...r].sort(s); else r = [...r].sort((a, b) => (b.best ? 1 : 0) - (a.best ? 1 : 0));
  return r;
}
function nFilters(f) { return (f.max < 40 ? 1 : 0) + f.metaux.size + f.pour.size + f.perso + f.nouveau + f.promo; }
function renderFilterSheet(base, onApply) {

  const draw = () => {
    $('#filterSheet').innerHTML = `

        <div class="fgroup"><label class="toggle">Personnalisable <input type="checkbox" data-t="perso" ${f.perso ? 'checked' : ''}></label><label class="toggle">Nouveautés <input type="checkbox" data-t="nouveau" ${f.nouveau ? 'checked' : ''}></label><label class="toggle">En promotion <input type="checkbox" data-t="promo" ${f.promo ? 'checked' : ''}></label></div>
      </div>
      <div class="sheet__foot" style="grid-template-columns:auto 1fr"><button class="btn btn--ghost" id="freset">Effacer</button><button class="btn" id="fapply">Voir ${count()} article${count() > 1 ? 's' : ''}</button></div>`;
    const upd = () => { $('#fapply').textContent = `Voir ${count()} article${count() > 1 ? 's' : ''}`; };
    $('#fmax').addEventListener('input', (e) => { f.max = +e.target.value; $('#maxv').textContent = f.max >= 40 ? 'tous' : eur(f.max); upd(); });
    $$('[data-f]', $('#filterSheet')).forEach(b => b.addEventListener('click', () => { const s = f[b.dataset.f]; s.has(b.dataset.v) ? s.delete(b.dataset.v) : s.add(b.dataset.v); b.setAttribute('aria-pressed', s.has(b.dataset.v)); upd(); }));
    $$('[data-t]', $('#filterSheet')).forEach(c => c.addEventListener('change', () => { f[c.dataset.t] = c.checked; upd(); }));
    $('#freset').addEventListener('click', () => { Object.assign(f, freshFilters(new URLSearchParams()), { sort: f.sort }); draw(); });

}

V.cat = (slug, params) => {
  const c = CATS[slug];

  if (!filt || filt._key !== key) { filt = freshFilters(params); filt._key = key; }
  const parent = c.parent && CATS[c.parent];
  const kids = Object.entries(CATS).filter(([, x]) => x.parent === slug || (c.parent && x.parent === c.parent));
  const titre = c.titre + (params.get('pour') ? ' · ' + { femme: 'Femme', homme: 'Homme', couple: 'Couple', enfant: 'Enfant' }[params.get('pour')] : '');
  return `<div class="wrap">

    ${kids.length ? `<div class="chips" style="padding:12px 0 4px;margin:0">${parent ? `<a class="chip" href="${catLink(c.parent)}">Tout voir</a>` : ''}${kids.filter(([s]) => !s.startsWith('moins-de') || slug === 'idees-cadeaux').slice(0, 12).map(([s, x]) => `<a class="chip ${s === slug ? 'on' : ''}" href="${catLink(s)}">${esc(x.titre.replace(/^Cadeaux · /, '').replace(/ personnalisé(e)?s$/, ''))}</a>`).join('')}</div>` : ''}
    <div class="toolbar"><button class="btn btn--ghost" data-filter-open>${ico('filter')} Filtrer${nFilters(filt) ? ` (${nFilters(filt)})` : ''}</button>
      <label class="sr-only" for="sort">Trier</label><select id="sort"><option value="pertinence">Pertinence</option><option value="prix-asc">Prix croissant</option><option value="prix-desc">Prix décroissant</option><option value="nouveautes">Nouveautés</option><option value="avis">Les plus aimés</option></select>
      <span class="n" id="nres"></span></div>

    <div class="grid" id="catGrid">${skeletons(4)}</div>
    <div style="height:40px"></div>
  </div>`;
};
V.cat.after = (slug) => {
  const c = CATS[slug]; if (!c) return;
  const base = PRODUITS.filter(c.filtre);
  const sortSel = $('#sort'); sortSel.value = filt.sort;
  const draw = (anim) => {
    if (!$('#catGrid')) return; // l'utilisateur a changé de page entre-temps
    const list = applyFilters(base, filt);
    $('#nres').textContent = `${list.length} article${list.length > 1 ? 's' : ''}`;
    $('[data-filter-open]').innerHTML = `${ico('filter')} Filtrer${nFilters(filt) ? ` (${nFilters(filt)})` : ''}`;
    const tags = [];
    if (filt.max < 40) tags.push(['max', '', `≤ ${eur(filt.max)}`]);
    filt.metaux.forEach(m => tags.push(['metaux', m, METAUX[m].nom]));
    filt.pour.forEach(m => tags.push(['pour', m, m[0].toUpperCase() + m.slice(1)]));
    ['perso', 'nouveau', 'promo'].forEach(k => filt[k] && tags.push([k, '', { perso: 'Personnalisable', nouveau: 'Nouveautés', promo: 'Promotions' }[k]]));
    $('#activeF').innerHTML = tags.map(([g, v, l]) => `<button data-unf="${g}" data-v="${v}" aria-label="Retirer le filtre ${l}">${esc(l)} ✕</button>`).join('');
    $$('[data-unf]').forEach(b => b.addEventListener('click', () => { const g = b.dataset.unf; if (g === 'max') filt.max = 40; else if (filt[g] instanceof Set) filt[g].delete(b.dataset.v); else filt[g] = false; draw(); }));
    $('#catGrid').innerHTML = list.length ? list.map(card).join('') : `<div class="empty" style="grid-column:1/-1"><p>Aucun article ne correspond à ces filtres.</p><button class="btn btn--ghost" data-unf-all>Effacer les filtres</button></div>`;
    const ua = $('[data-unf-all]'); ua && ua.addEventListener('click', () => { Object.assign(filt, freshFilters(new URLSearchParams()), { sort: filt.sort }); draw(); });
    observeReveal(anim);
  };
  sortSel.addEventListener('change', () => { filt.sort = sortSel.value; draw(); });
  $('[data-filter-open]').addEventListener('click', () => { renderFilterSheet(base, () => draw()); openSheet('filterSheet'); });
  setTimeout(() => draw(true), 280); // squelettes visibles brièvement
};

V.product.after = (id) => {
  const p = byId[id]; if (!p) return;
  const cfg = V.product.cfg;
  const font = () => POLICES.find(f => f.id === cfg.font) || POLICES[0];
  const draw = () => {
    const o = { metal: cfg.metal, font: font(), ile: p.ile };
    if (p.perso && p.perso.type !== 'musique') { o.text = cfg.text || undefined; o.text2 = cfg.text2 || undefined; }
    if (p.montants) o.text = cfg.montant + ' €';
    $('#galMain').innerHTML = artOf(p, { ...o, s: 300 });
    const pv = $('#preview'); if (pv) pv.innerHTML = artOf(p, { ...o, s: 170 });
    const c1 = $('#cnt1'); if (c1) c1.textContent = `${cfg.text.length}/${p.perso.max}`;
  };
  const drawShip = () => {
    const z = ZONES.find(x => x.id === state.zone);
    $('#shipList').innerHTML = z.modes.map(m => `<li><b>${m.nom}</b> · ${m.delai} · ${m.prix ? eur(m.prix) : 'gratuit'}</li>`).join('');
  };
  $$('[data-cfg]').forEach(inp => inp.addEventListener('input', () => {
    cfg[inp.dataset.cfg] = inp.value.trimStart();
    inp.closest('.field')?.classList.remove('err');
    $('#perr') && ($('#perr').hidden = true);
    draw();
  }));
  $$('[data-font]').forEach(b => b.addEventListener('click', () => { cfg.font = b.dataset.font; $$('[data-font]').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); }));
  $$('[data-metal]').forEach(b => b.addEventListener('click', () => { cfg.metal = b.dataset.metal; $$('[data-metal]').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#metalName').textContent = METAUX[cfg.metal].nom; draw(); }));
  $$('[data-montant]').forEach(b => b.addEventListener('click', () => {
    cfg.montant = +b.dataset.montant; $$('[data-montant]').forEach(x => x.setAttribute('aria-pressed', x === b));
    $('#pdpPrice').innerHTML = `<div class="price">${eur(cfg.montant)}</div>`; $('#ctaPrice').textContent = eur(cfg.montant); draw();
  }));
  $('#shipZone').addEventListener('change', (e) => { state.zone = e.target.value; store.set('zone', state.zone); drawShip(); });
  // Galerie : points, miniatures, zoom
  const track = $('#galTrack');
  track.addEventListener('scroll', () => { const i = Math.round(track.scrollLeft / track.clientWidth); $$('.gal__dots i').forEach((d, k) => d.classList.toggle('on', k === i)); $$('[data-thumb]').forEach((d, k) => d.classList.toggle('on', k === i)); }, { passive: true });
  $$('[data-thumb]').forEach(b => b.addEventListener('click', () => track.scrollTo({ left: track.clientWidth * +b.dataset.thumb, behavior: 'smooth' })));
  $$('[data-zoom]').forEach(sl => { const go = () => openZoom(sl.innerHTML); sl.addEventListener('click', go); sl.addEventListener('keydown', e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), go())); });
  // Ajout au panier avec validation
  $('#addBtn').addEventListener('click', () => {
    let ok = true;
    if (p.perso) {
      if (!cfg.text.trim()) { ok = false; ($('#f1') || $('#mPrenom').closest('.field')).classList.add('err'); }
      if (p.perso.type === 'duo' && !cfg.text2.trim()) { ok = false; $('#f2').classList.add('err'); }
      if (!ok) { const e = $('#perr'); if (e) e.hidden = false; ($('#pt1') || $('#mPrenom')).focus(); ($('#preview') || $('#mPrenom')).scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }
    if (p.taille && !cfg.taille) { if (ok) $('#taille').focus(); ok = false; $('#ft').classList.add('err'); $('#terr').hidden = false; }
    if (!ok) return toast('Il manque une information pour ton bijou.');
    const opts = {};
    if (cfg.metal) opts.metal = cfg.metal;
    if (p.perso) { opts.text = cfg.text.trim(); if (cfg.text2) opts.text2 = cfg.text2.trim(); if (cfg.font) opts.font = cfg.font; if (cfg.occ) opts.occ = cfg.occ; if (cfg.msg) opts.msg = cfg.msg; }
    if (cfg.taille) opts.taille = cfg.taille;
    if (p.montants) opts.montant = cfg.montant;
    addToCart(p.id, opts, cfg.montant || p.prix);
  });
  $('#taille')?.addEventListener('change', () => { $('#ft').classList.remove('err'); $('#terr').hidden = true; });
  draw(); drawShip();
};
function openZoom(html) {
  const z = $('#zoom');

}

/* ---------- Commande ---------- */
V.checkout = () => {
  if (!state.cart.length && state.co.step !== 4) return `<div class="wrap"><div class="empty" style="padding-top:64px">${ico('bag')}<p>Ton panier est vide.</p><a class="btn" href="#/">Retour à l’accueil</a></div></div>`;
  const co = state.co;
  if (!co.zone) co.zone = state.zone;
  const zone = ZONES.find(z => z.id === co.zone);
  if (!zone.modes.some(m => m.id === co.mode)) co.mode = null;
  const t = totals(co.mode, co.zone);
  const isRetrait = co.mode === 'retrait';
  const stepsHTML = `<ol class="steps">${['Livraison', 'Coordonnées', 'Paiement'].map((s, i) => `<li class="${co.step === i + 1 ? 'on' : co.step > i + 1 ? 'done' : ''}" ${co.step === i + 1 ? 'aria-current="step"' : ''}>${i + 1}. ${s}</li>`).join('')}</ol>`;
  if (co.step === 4) return `<div class="wrap"><div class="done-box view-enter"><div class="check">${ico('check')}</div><h1 style="font-size:var(--zr-fs-h1)">Merci ${esc(co.info.prenom || '')} !</h1>
    <p>Ta commande <b>${co.num}</b> est confirmée. Tu vas recevoir un e-mail récapitulatif.</p>
    <p class="note" style="max-width:480px;text-align:left">${co.lastMode === 'retrait' ? `Nous t’envoyons un e-mail dès qu’elle est prête. Retrait à ${BOUTIQUE.adresse}, ${BOUTIQUE.horaires}.` : co.lastMode === 'livreur' ? 'Notre livreur te la remet en main propre sous 48 h.' : 'Tu recevras ton numéro de suivi La Poste dès l’expédition.'}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><a class="btn" href="#/compte?n=${co.num}">Suivre ma commande</a><a class="btn btn--ghost" href="#/">Retour à la boutique</a></div>
    <p style="font-size:13px;color:var(--zr-encre-2)">Prototype : aucune commande réelle n’a été passée.</p></div></div>`;
  const summary = `<aside class="summary"><h2 style="font-size:22px">Récapitulatif</h2>
    ${state.cart.map(l => { const p = byId[l.id]; return `<div class="line"><div class="line__img">${artOf(p, { s: 50, metal: l.opts.metal, text: l.opts.text, text2: l.opts.text2 })}</div><div><div class="line__name">${l.qty} × ${esc(p.nom)}</div><div class="line__opts">${l.opts.text ? '« ' + esc(l.opts.text) + (l.opts.text2 ? ' & ' + esc(l.opts.text2) : '') + ' »' : ''}</div><b>${eur(l.prix * l.qty)}</b></div></div>`; }).join('')}
    <div class="totals" style="margin-top:12px"><div><span>Sous-total</span><span>${eur(t.sub)}</span></div>${t.remise ? `<div class="disc"><span>Remise automatique</span><span>−${eur(t.remise)}</span></div>` : ''}
    <div><span>Livraison</span><span>${t.port === null ? '—' : t.port === 0 ? 'Offerte' : eur(t.port)}</span></div><div class="grand"><span>Total</span><span>${eur(t.total)}</span></div></div></aside>`;
  let body = '';
  if (co.step === 1) body = `<div><h2>Où livrer ta commande ?</h2>
    <div class="zone-grid" role="group" aria-label="Zone de livraison">${ZONES.map(z => `<button data-zone="${z.id}" aria-pressed="${z.id === co.zone}">${z.nom}</button>`).join('')}</div>
    <h2 style="font-size:22px">Mode de livraison</h2>
    ${zone.modes.map(m => `<label class="radio-card"><input type="radio" name="mode" value="${m.id}" ${co.mode === m.id ? 'checked' : ''}><span class="rc"><b><span>${m.nom}</span><span>${m.prix === 0 ? 'Gratuit' : t.sub >= BOUTIQUE.livraisonOfferteDes ? `<s style="font-weight:400;color:var(--zr-encre-2)">${eur(m.prix)}</s> Offerte` : eur(m.prix)}</span></b><small>${m.delai} · ${m.info}</small></span></label>`).join('')}
    ${zone.id !== 'mayotte' ? `<p class="note">Tu es à Mayotte ? Choisis « Mayotte » pour la livraison sous 48 h ou le retrait gratuit en boutique.</p>` : ''}
    <button class="btn btn--block" id="coNext" ${co.mode ? '' : 'disabled'} style="margin-top:12px">Continuer</button></div>`;
  if (co.step === 2) {
    const v = (k) => esc(co.info[k] || '');
    const fld = (k, l, type = 'text', ac = '', req = true) => `<label>${l}${req ? ' *' : ''}<div class="field"><input name="${k}" type="${type}" value="${v(k)}" autocomplete="${ac}" ${req ? 'required' : ''}></div></label>`;
    body = `<form id="coForm" class="form-grid" novalidate><h2>Tes coordonnées</h2>
      <div class="fields-2">${fld('prenom', 'Prénom', 'text', 'given-name')}${fld('nom', 'Nom', 'text', 'family-name')}</div>
      ${fld('email', 'E-mail', 'email', 'email')}${fld('tel', 'Téléphone (pour le livreur ou le retrait)', 'tel', 'tel')}
      ${isRetrait ? `<p class="note">Retrait en boutique : ${BOUTIQUE.adresse}, ${BOUTIQUE.horaires}. Nous t’envoyons un e-mail quand ta commande est prête.</p>` : `${fld('adresse', 'Adresse', 'text', 'street-address')}${fld('complement', 'Complément (bâtiment, quartier…)', 'text', 'address-line2', false)}<div class="fields-2">${fld('cp', 'Code postal', 'text', 'postal-code')}${fld('ville', 'Ville', 'text', 'address-level2')}</div>`}
      <p class="ferr" id="coErr" hidden>Merci de remplir les champs marqués d’une étoile.</p>
      <div style="display:flex;gap:10px"><button type="button" class="btn btn--ghost" data-co-back>Retour</button><button class="btn" style="flex:1">Continuer vers le paiement</button></div></form>`;
  }
  if (co.step === 3) body = `<div><h2>Paiement</h2>
    <label class="radio-card"><input type="radio" name="pay" value="cb" ${co.pay === 'cb' ? 'checked' : ''}><span class="rc"><b>Carte bancaire</b><small>Visa, Mastercard, American Express · paiement sécurisé SumUp / Wix</small></span></label>
    <label class="radio-card"><input type="radio" name="pay" value="paypal" ${co.pay === 'paypal' ? 'checked' : ''}><span class="rc"><b>PayPal</b><small>Tu seras redirigé vers PayPal pour valider.</small></span></label>
    ${isRetrait ? `<label class="radio-card"><input type="radio" name="pay" value="especes" ${co.pay === 'especes' ? 'checked' : ''}><span class="rc"><b>Espèces en boutique</b><small>À régler au retrait, à Kavani, Mamoudzou.</small></span></label>` : `<p class="note">Le paiement en espèces est possible uniquement avec le retrait en boutique à Mayotte.</p>`}
    <p style="font-size:13px;color:var(--zr-encre-2);margin:8px 0 14px">${ico('lock', 'ico" style="display:inline;width:16px;vertical-align:-3px')} Paiement 100 % sécurisé. Nous n’acceptons pas les chèques, ni le paiement en plusieurs fois pour le moment.</p>
    <div style="display:flex;gap:10px"><button class="btn btn--ghost" data-co-back>Retour</button><button class="btn" style="flex:1" id="coPay" ${co.pay ? '' : 'disabled'}>Payer ${eur(t.total)}</button></div></div>`;
  return `<div class="wrap">${stepsHTML}<div class="co">${body}${summary}</div></div>`;
};
V.checkout.after = () => {
  const co = state.co;
  $$('[data-zone]').forEach(b => b.addEventListener('click', () => { co.zone = b.dataset.zone; state.zone = co.zone; store.set('zone', co.zone); co.mode = null; route(true); }));
  $$('input[name=mode]').forEach(r => r.addEventListener('change', () => { co.mode = r.value; route(true); }));
  $('#coNext')?.addEventListener('click', () => { co.step = 2; route(); });
  $$('[data-co-back]').forEach(b => b.addEventListener('click', () => { co.step--; route(); }));
  const form = $('#coForm');
  form?.addEventListener('submit', (e) => {
    e.preventDefault();
    let ok = true;
    $$('input', form).forEach(i => {
      co.info[i.name] = i.value.trim();
      const bad = i.required && (!i.value.trim() || (i.type === 'email' && !/^\S+@\S+\.\S+$/.test(i.value)));
      i.closest('.field').classList.toggle('err', bad);
      i.setAttribute('aria-invalid', bad);
      if (bad && ok) { ok = false; i.focus(); }
    });
    $('#coErr').hidden = ok;
    if (ok) { co.step = 3; route(); }
  });
  $$('input[name=pay]').forEach(r => r.addEventListener('change', () => { co.pay = r.value; $('#coPay').disabled = false; }));
  $('#coPay')?.addEventListener('click', () => {
    co.num = 'ZR-' + (27000 + Math.floor(Math.random() * 999));
    co.lastMode = co.mode;
    co.step = 4; state.cart = []; saveCart(); route();
    co.pay = null; co.mode = null;
  });
};
